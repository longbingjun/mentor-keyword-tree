<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>带教认知树</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020208;
      --ink: #efe7d2;
      --muted: rgba(239, 231, 210, 0.44);
      --dim: rgba(239, 231, 210, 0.2);
      --gold: #d9b66c;
      --gold-hot: #ffe6a3;
      --blue: #8ad0dc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 67% 45%, rgba(217, 182, 108, 0.12), transparent 34%),
        radial-gradient(circle at 82% 30%, rgba(138, 208, 220, 0.11), transparent 28%),
        linear-gradient(90deg, rgba(2, 2, 8, 0.96) 0%, rgba(2, 2, 8, 0.62) 31%, rgba(2, 2, 8, 0.04) 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 4.8vh 3vw;
      z-index: 1;
      pointer-events: none;
      border-top: 1px solid rgba(217, 182, 108, 0.08);
      border-bottom: 1px solid rgba(217, 182, 108, 0.08);
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.34);
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      background: #020208;
    }

    .hud {
      position: fixed;
      z-index: 2;
      left: clamp(22px, 5.4vw, 72px);
      top: clamp(28px, 10vh, 90px);
      width: min(360px, 34vw);
      pointer-events: auto;
    }

    .kicker {
      margin: 0 0 18px;
      color: rgba(239, 231, 210, 0.28);
      font-size: 10px;
      letter-spacing: 0.52em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-family: "Noto Serif SC", "SimSun", serif;
      font-size: clamp(28px, 3.1vw, 46px);
      font-weight: 400;
      letter-spacing: 0.24em;
      line-height: 1.1;
    }

    .keyword {
      margin: clamp(44px, 10vh, 92px) 0 0;
      min-height: 78px;
      color: rgba(255, 246, 221, 0.94);
      font-family: "Noto Serif SC", "SimSun", serif;
      font-size: clamp(48px, 7vw, 92px);
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1;
    }

    .whisper {
      width: min(310px, 100%);
      min-height: 54px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
    }

    button {
      border: 1px solid rgba(217, 182, 108, 0.24);
      border-radius: 999px;
      padding: 10px 15px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.03);
      font: 13px "Microsoft YaHei", "PingFang SC", sans-serif;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease;
    }

    button:hover {
      border-color: rgba(255, 230, 163, 0.72);
      background: rgba(217, 182, 108, 0.1);
      color: #fff2c8;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .timeline {
      position: fixed;
      z-index: 2;
      left: clamp(22px, 5.4vw, 72px);
      bottom: clamp(24px, 8vh, 70px);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border: 1px solid rgba(217, 182, 108, 0.34);
      border-radius: 50%;
      background: transparent;
      padding: 0;
    }

    .dot.lit {
      border-color: rgba(255, 230, 163, 0.98);
      background: var(--gold-hot);
      box-shadow: 0 0 18px rgba(255, 230, 163, 0.86);
    }

    .dot.active {
      transform: scale(1.45);
    }

    .count {
      margin-left: 4px;
      color: rgba(239, 231, 210, 0.34);
      font-size: 11px;
      letter-spacing: 0.28em;
    }

    .node-card {
      position: fixed;
      z-index: 2;
      right: clamp(20px, 4vw, 54px);
      bottom: clamp(20px, 5.6vh, 52px);
      width: min(280px, 30vw);
      color: rgba(239, 231, 210, 0.5);
      font-size: 12px;
      line-height: 1.8;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .node-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .node-card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 18px;
      font-family: "Noto Serif SC", "SimSun", serif;
      font-weight: 400;
      letter-spacing: 0.18em;
    }

    @media (max-width: 860px) {
      html,
      body {
        overflow: auto;
      }

      body::after {
        display: none;
      }

      .hud {
        left: 20px;
        right: 20px;
        top: 24px;
        width: auto;
      }

      .keyword {
        margin-top: 34px;
        font-size: 52px;
      }

      .whisper {
        max-width: 280px;
      }

      .timeline {
        left: 20px;
        right: 20px;
        bottom: 20px;
      }

      .node-card {
        left: 20px;
        right: 20px;
        bottom: 58px;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <canvas id="tree" aria-hidden="true"></canvas>

  <main class="hud">
    <p class="kicker">MENTOR COGNITION TREE</p>
    <h1>带教认知树</h1>
    <h2 id="keyword" class="keyword">未点亮</h2>
    <p id="whisper" class="whisper">点击树上的第一颗光果，让这棵树从根部开始生长。</p>
    <div class="actions">
      <button id="next">点亮下一颗</button>
      <button id="replay">重生长</button>
    </div>
  </main>

  <nav id="timeline" class="timeline" aria-label="感悟时间线"></nav>

  <aside id="nodeCard" class="node-card">
    <strong>认知节点</strong>
    所有果实被点亮后，枝干之间会被金色光流连接，最后凝结成你对带教的认知结构。
  </aside>

  <script>
    const records = [
      { keyword: "清醒", short: "清", hint: "先回到目标，再判断动作。", thinking: ["目标", "约束", "动作"] },
      { keyword: "精准", short: "准", hint: "在杂乱信息里抓住真正改变结果的变量。", thinking: ["噪音", "变量", "验证"] },
      { keyword: "耐心", short: "耐", hint: "不是急着给答案，而是帮我接上理解。", thinking: ["卡点", "换例子", "理解"] },
      { keyword: "边界", short: "界", hint: "先守住必须完成的事，再追求更漂亮。", thinking: ["交付", "收益", "范围"] },
      { keyword: "长远", short: "远", hint: "一次任务结束后，方法应该继续留下来。", thinking: ["复用", "沉淀", "能力"] },
      { keyword: "坦诚", short: "诚", hint: "直接指出问题，也给出可以改变的方向。", thinking: ["问题", "影响", "调整"] },
      { keyword: "结构", short: "构", hint: "把混乱想法拆成可以推进的层次。", thinking: ["背景", "问题", "判断", "行动"] },
      { keyword: "笃定", short: "定", hint: "想清楚之后，就给行动一点信任。", thinking: ["前提", "不确定", "推进"] }
    ];

    const canvas = document.getElementById("tree");
    const ctx = canvas.getContext("2d");
    const keywordEl = document.getElementById("keyword");
    const whisperEl = document.getElementById("whisper");
    const nextButton = document.getElementById("next");
    const replayButton = document.getElementById("replay");
    const timelineEl = document.getElementById("timeline");
    const nodeCard = document.getElementById("nodeCard");
    const pointer = { x: -999, y: -999 };

    let pixelRatio = 1;
    let particles = [];
    let curves = [];
    let roots = [];
    let fruit = [];
    let stars = [];
    let streamers = [];
    let nodes = [];
    let litCount = 0;
    let selected = -1;
    let grow = 0.15;
    let targetGrow = 0.15;
    let finalStart = 0;

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function ease(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function bezier(a, b, c, d, t) {
      const mt = 1 - t;
      return {
        x: mt * mt * mt * a.x + 3 * mt * mt * t * b.x + 3 * mt * t * t * c.x + t * t * t * d.x,
        y: mt * mt * mt * a.y + 3 * mt * mt * t * b.y + 3 * mt * t * t * c.y + t * t * t * d.y
      };
    }

    function addDot(x, y, thickness, birth, tone, kind) {
      particles.push({
        x,
        y,
        baseX: x,
        baseY: y,
        r: rand(0.34, 1.15) * clamp(thickness / 16, 0.42, 1.45),
        a: kind === "trunk" ? rand(0.08, 0.28) : rand(0.16, 0.52),
        birth: clamp(birth + rand(-0.025, 0.035), 0, 1),
        tone,
        kind,
        drift: rand(0, Math.PI * 2)
      });
    }

    function dotAlongCurve(points, width, density, tone, kind, birthShift = 0) {
      curves.push({ points, width, tone, kind, birth: birthShift });
      const [a, b, c, d] = points;
      const steps = Math.max(42, Math.round(density));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = bezier(a, b, c, d, t);
        const thickness = width * (1 - t * 0.68);
        const dots = Math.max(3, Math.round(thickness * (kind === "trunk" ? 0.18 : 0.24)));
        const birth = 1 - p.y / innerHeight + birthShift + t * 0.04;
        for (let j = 0; j < dots; j++) {
          addDot(
            p.x + rand(-thickness, thickness),
            p.y + rand(-thickness, thickness),
            thickness,
            birth,
            tone,
            kind
          );
        }
      }
      return d;
    }

    function growBranch(start, angle, length, depth, width, birthShift) {
      if (depth <= 0 || length < 28) return;
      const end = {
        x: start.x + Math.cos(angle) * length,
        y: start.y + Math.sin(angle) * length
      };
      const bend = length * rand(0.18, 0.32);
      const points = [
        start,
        { x: start.x + Math.cos(angle - 0.55) * bend, y: start.y + Math.sin(angle - 0.55) * bend },
        { x: (start.x + end.x) / 2 + rand(-length * 0.24, length * 0.24), y: (start.y + end.y) / 2 + rand(-length * 0.12, length * 0.12) },
        end
      ];
      dotAlongCurve(points, width, length / 3.5, depth > 5 ? "gold" : Math.random() > 0.45 ? "blue" : "gold", "branch", birthShift);

      const spread = rand(0.34, 0.72);
      const nextLength = length * rand(0.58, 0.74);
      growBranch(end, angle - spread, nextLength, depth - 1, width * 0.66, birthShift + 0.075);
      growBranch(end, angle + spread * rand(0.78, 1.2), nextLength * rand(0.82, 1.12), depth - 1, width * 0.62, birthShift + 0.085);
      if (depth > 4) {
        growBranch(end, angle + rand(-0.26, 0.26), nextLength * 0.62, depth - 2, width * 0.46, birthShift + 0.11);
      }
    }

    function buildScene() {
      particles = [];
      curves = [];
      roots = [];
      fruit = [];
      stars = [];
      streamers = [];
      nodes = [];

      const mobile = innerWidth < 860;
      const base = {
        x: innerWidth * (mobile ? 0.66 : 0.68),
        y: innerHeight * 1.05
      };
      const crownTop = innerHeight * 0.06;
      const trunkHeight = innerHeight * 0.93;
      const trunkWidth = Math.max(44, innerWidth * (mobile ? 0.05 : 0.058));

      const trunkCurves = [
        [
          base,
          { x: base.x - innerWidth * 0.05, y: innerHeight * 0.78 },
          { x: base.x + innerWidth * 0.02, y: innerHeight * 0.38 },
          { x: base.x - innerWidth * 0.02, y: crownTop }
        ],
        [
          { x: base.x - trunkWidth * 0.35, y: base.y },
          { x: base.x - innerWidth * 0.13, y: innerHeight * 0.72 },
          { x: base.x - innerWidth * 0.08, y: innerHeight * 0.42 },
          { x: base.x - innerWidth * 0.18, y: innerHeight * 0.16 }
        ],
        [
          { x: base.x + trunkWidth * 0.28, y: base.y },
          { x: base.x + innerWidth * 0.12, y: innerHeight * 0.68 },
          { x: base.x + innerWidth * 0.08, y: innerHeight * 0.36 },
          { x: base.x + innerWidth * 0.22, y: innerHeight * 0.12 }
        ]
      ];

      trunkCurves.forEach((curve, index) => {
        dotAlongCurve(curve, trunkWidth * (index === 0 ? 1 : 0.72), trunkHeight / 2.3, "gold", "trunk", index * 0.012);
      });

      const branchStarts = [
        { x: base.x - innerWidth * 0.03, y: innerHeight * 0.66, a: -2.62, l: innerWidth * 0.28 },
        { x: base.x + innerWidth * 0.02, y: innerHeight * 0.61, a: -0.62, l: innerWidth * 0.26 },
        { x: base.x - innerWidth * 0.03, y: innerHeight * 0.48, a: -2.92, l: innerWidth * 0.34 },
        { x: base.x + innerWidth * 0.02, y: innerHeight * 0.45, a: -0.32, l: innerWidth * 0.34 },
        { x: base.x - innerWidth * 0.02, y: innerHeight * 0.31, a: -2.42, l: innerWidth * 0.3 },
        { x: base.x + innerWidth * 0.01, y: innerHeight * 0.29, a: -0.82, l: innerWidth * 0.28 }
      ];

      branchStarts.forEach((b, i) => {
        growBranch({ x: b.x, y: b.y }, b.a, b.l, 7, trunkWidth * 0.23, 0.14 + i * 0.035);
      });

      for (let i = 0; i < 240; i++) {
        stars.push({
          x: rand(innerWidth * 0.34, innerWidth * 0.98),
          y: rand(innerHeight * 0.04, innerHeight * 0.96),
          r: rand(0.25, 1.05),
          a: rand(0.04, 0.25),
          pulse: rand(0, Math.PI * 2)
        });
      }

      const fruitPositions = mobile
        ? [[0.44, 0.72], [0.62, 0.63], [0.78, 0.57], [0.50, 0.49], [0.72, 0.43], [0.88, 0.34], [0.58, 0.28], [0.78, 0.18]]
        : [[0.43, 0.73], [0.57, 0.61], [0.76, 0.56], [0.47, 0.45], [0.68, 0.39], [0.88, 0.34], [0.56, 0.23], [0.79, 0.16]];

      fruit = records.map((record, index) => {
        const [fx, fy] = fruitPositions[index];
        return {
          x: innerWidth * fx,
          y: innerHeight * fy,
          baseX: innerWidth * fx,
          baseY: innerHeight * fy,
          radius: Math.max(15, Math.min(innerWidth, innerHeight) * 0.021),
          growAt: clamp((index + 1) / records.length, 0.14, 1),
          pulse: rand(0, Math.PI * 2),
          record,
          index
        };
      });

      for (let i = 0; i < 80; i++) {
        streamers.push({
          offset: rand(0, 1),
          speed: rand(0.032, 0.08),
          side: rand(-1, 1),
          radius: rand(0.8, 2.2),
          hue: Math.random() > 0.35 ? "gold" : "blue"
        });
      }

      nodes = records.map((record, index) => {
        const angle = (index / records.length) * Math.PI * 2 - Math.PI / 2;
        return {
          x: innerWidth * 0.7 + Math.cos(angle) * innerWidth * 0.19,
          y: innerHeight * 0.45 + Math.sin(angle) * innerHeight * 0.26,
          label: record.keyword,
          pulse: rand(0, Math.PI * 2)
        };
      });
    }

    function drawParticle(p, t) {
      const appear = clamp((grow - p.birth) / 0.08, 0, 1);
      if (appear <= 0) return;
      const dx = pointer.x - p.baseX;
      const dy = pointer.y - p.baseY;
      const dist = Math.hypot(dx, dy);
      const pull = dist < 150 ? (1 - dist / 150) * 2.4 : 0;
      const flow = Math.sin(t * 1.9 + p.drift + p.baseY * 0.013);
      const x = p.baseX + flow * (p.kind === "trunk" ? 1.5 : 2.8) - dx * pull * 0.012;
      const y = p.baseY + Math.cos(t * 1.25 + p.drift) * 1.2 - dy * pull * 0.012;
      const a = p.a * ease(appear);
      ctx.beginPath();
      ctx.fillStyle = p.tone === "blue"
        ? `rgba(138, 208, 220, ${a * 0.82})`
        : `rgba(226, 188, 108, ${a})`;
      ctx.arc(x, y, p.r * (0.65 + appear * 0.7), 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCurves() {
      curves.forEach((curve) => {
        const endBirth = clamp(curve.birth + 0.22, 0, 1);
        const appear = clamp((grow - endBirth) / 0.12, 0, 1);
        if (appear <= 0) return;
        const [a, b, c, d] = curve.points;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.bezierCurveTo(b.x, b.y, c.x, c.y, d.x, d.y);
        ctx.lineWidth = Math.max(0.6, curve.width * (curve.kind === "trunk" ? 0.075 : 0.055));
        ctx.strokeStyle = curve.tone === "blue"
          ? `rgba(138, 208, 220, ${0.08 * appear})`
          : `rgba(255, 230, 163, ${0.1 * appear})`;
        ctx.stroke();
      });
    }

    function drawStreams(t) {
      const maxY = innerHeight * (1.08 - grow * 1.02);
      streamers.forEach((s) => {
        let phase = (s.offset + t * s.speed) % 1;
        const y = innerHeight * 1.04 - phase * innerHeight * 0.96;
        if (y < maxY) return;
        const trunkX = innerWidth * 0.68 + Math.sin(phase * Math.PI * 4 + s.side) * innerWidth * 0.035;
        const spread = Math.max(0, (0.62 - phase)) * innerWidth * 0.42 * s.side;
        const x = trunkX + spread + Math.sin(t * 2 + s.offset * 9) * 12;
        const alpha = Math.sin(phase * Math.PI) * 0.9;
        const gradient = ctx.createRadialGradient(x, y, 0, x, y, s.radius * 9);
        gradient.addColorStop(0, s.hue === "gold" ? `rgba(255, 230, 163, ${alpha})` : `rgba(138, 208, 220, ${alpha * 0.75})`);
        gradient.addColorStop(1, "rgba(255, 230, 163, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, s.radius * 9, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawFruit(f, t) {
      const visible = f.index < litCount || f.index === litCount;
      if (!visible || grow < f.growAt - 0.02) return;
      const lit = f.index < litCount;
      f.x = f.baseX + Math.cos(t + f.pulse) * 4;
      f.y = f.baseY + Math.sin(t * 1.4 + f.pulse) * 5;
      const hover = Math.hypot(pointer.x - f.x, pointer.y - f.y) < f.radius + 30;
      const glow = lit ? 0.72 : hover ? 1.34 : 0.98 + Math.sin(t * 2.1 + f.pulse) * 0.2;
      const halo = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius * 5.6);
      halo.addColorStop(0, `rgba(255, 230, 163, ${0.92 * glow})`);
      halo.addColorStop(0.32, `rgba(226, 188, 108, ${0.32 * glow})`);
      halo.addColorStop(1, "rgba(226, 188, 108, 0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.radius * 5.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = lit ? "rgba(231, 196, 117, 0.92)" : "rgba(255, 233, 170, 1)";
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(2, 2, 8, 0.84)";
      ctx.font = `500 ${Math.max(12, f.radius * 0.78)}px "Microsoft YaHei", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(f.record.short, f.x, f.y + 0.5);
    }

    function drawFinal(t) {
      if (litCount < records.length) return;
      const age = finalStart ? clamp((performance.now() - finalStart) / 3200, 0, 1) : 0;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < fruit.length - 1; i++) {
        const a = fruit[i];
        const b = fruit[i + 1];
        ctx.strokeStyle = `rgba(255, 230, 163, ${0.1 + age * 0.28})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo((a.x + b.x) / 2 + Math.sin(t + i) * 38, (a.y + b.y) / 2 - 42, b.x, b.y);
        ctx.stroke();
      }

      if (age > 0.45) {
        const alpha = clamp((age - 0.45) / 0.55, 0, 1);
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            if ((i + j) % 3 !== 0 && Math.abs(i - j) > 2) continue;
            ctx.strokeStyle = `rgba(255, 230, 163, ${0.07 * alpha})`;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
        nodes.forEach((n) => {
          const pulse = 0.8 + Math.sin(t * 2 + n.pulse) * 0.2;
          ctx.fillStyle = `rgba(255, 230, 163, ${0.84 * alpha * pulse})`;
          ctx.beginPath();
          ctx.arc(n.x, n.y, 5 + pulse * 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(239, 231, 210, ${0.6 * alpha})`;
          ctx.font = '13px "Microsoft YaHei", sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(n.label, n.x, n.y + 26);
        });
      }

      const flare = ctx.createRadialGradient(innerWidth * 0.68, innerHeight * 0.45, 20, innerWidth * 0.68, innerHeight * 0.45, innerWidth * 0.48);
      flare.addColorStop(0, `rgba(255, 230, 163, ${0.11 * age})`);
      flare.addColorStop(1, "rgba(255, 230, 163, 0)");
      ctx.fillStyle = flare;
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.restore();
    }

    function draw(time) {
      const t = time * 0.001;
      grow += (targetGrow - grow) * 0.045;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      stars.forEach((s) => {
        ctx.fillStyle = `rgba(239, 231, 210, ${s.a + Math.sin(t + s.pulse) * 0.03})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      drawCurves();
      particles.forEach((p) => drawParticle(p, t));
      drawStreams(t);
      drawFinal(t);
      fruit.forEach((f) => drawFruit(f, t));
      ctx.restore();

      requestAnimationFrame(draw);
    }

    function renderTimeline() {
      timelineEl.innerHTML = "";
      records.forEach((record, index) => {
        const dot = document.createElement("button");
        dot.className = `dot ${index < litCount ? "lit" : ""} ${index === selected ? "active" : ""}`;
        dot.type = "button";
        dot.title = record.keyword;
        dot.addEventListener("click", () => {
          if (index < litCount) selectRecord(index);
        });
        timelineEl.appendChild(dot);
      });
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `${String(litCount).padStart(2, "0")} / ${String(records.length).padStart(2, "0")}`;
      timelineEl.appendChild(count);
    }

    function selectRecord(index) {
      selected = index;
      const record = records[index];
      keywordEl.textContent = record.keyword;
      whisperEl.textContent = record.hint;
      renderTimeline();
    }

    function lightNext() {
      if (litCount >= records.length) return;
      litCount += 1;
      targetGrow = clamp(litCount / records.length + 0.08, 0.15, 1);
      selectRecord(litCount - 1);
      if (litCount === records.length) {
        nextButton.disabled = true;
        nextButton.textContent = "已凝结";
        finalStart = performance.now();
        setTimeout(() => nodeCard.classList.add("show"), 1000);
      }
    }

    function reset() {
      litCount = 0;
      selected = -1;
      grow = 0.15;
      targetGrow = 0.15;
      finalStart = 0;
      keywordEl.textContent = "未点亮";
      whisperEl.textContent = "点击树上的第一颗光果，让这棵树从根部开始生长。";
      nextButton.disabled = false;
      nextButton.textContent = "点亮下一颗";
      nodeCard.classList.remove("show");
      renderTimeline();
    }

    function fruitAt(x, y) {
      return fruit.find((f) => {
        const visible = f.index < litCount || f.index === litCount;
        return visible && Math.hypot(x - f.x, y - f.y) < f.radius + 32;
      });
    }

    canvas.addEventListener("click", (event) => {
      const f = fruitAt(event.clientX, event.clientY);
      if (!f) return;
      if (f.index === litCount) {
        lightNext();
      } else if (f.index < litCount) {
        selectRecord(f.index);
      }
    });

    window.addEventListener("pointermove", (event) => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });

    nextButton.addEventListener("click", lightNext);
    replayButton.addEventListener("click", reset);

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * pixelRatio);
      canvas.height = Math.floor(innerHeight * pixelRatio);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      buildScene();
    }

    window.addEventListener("resize", resize);
    resize();
    reset();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
