<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>思维之树 | 关键词盲盒</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --text: #f7f2e8;
      --muted: rgba(247, 242, 232, 0.62);
      --line: rgba(255, 255, 255, 0.14);
      --gold: #f6c96f;
      --amber: #ff8d3b;
      --cyan: #88f4ff;
      --panel: rgba(5, 5, 5, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 78% 58%, rgba(255, 139, 59, 0.12), transparent 34%),
        radial-gradient(circle at 88% 24%, rgba(136, 244, 255, 0.08), transparent 24%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.96) 0%, rgba(0, 0, 0, 0.74) 36%, rgba(0, 0, 0, 0.08) 100%);
      z-index: 1;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hero {
      position: fixed;
      left: clamp(22px, 6vw, 88px);
      top: clamp(28px, 9vh, 92px);
      z-index: 2;
      width: min(430px, calc(100vw - 44px));
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 92px);
      line-height: 0.94;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    h1 span {
      display: block;
      margin-top: 10px;
      color: rgba(247, 242, 232, 0.46);
      font-size: clamp(15px, 1.8vw, 22px);
      font-weight: 400;
      letter-spacing: 0.34em;
    }

    .intro {
      margin: 30px 0 0;
      max-width: 390px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      font: inherit;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(246, 201, 111, 0.68);
      background: rgba(246, 201, 111, 0.1);
      box-shadow: 0 0 32px rgba(246, 201, 111, 0.12);
    }

    .progress {
      position: fixed;
      left: clamp(22px, 6vw, 88px);
      bottom: clamp(24px, 8vh, 74px);
      z-index: 2;
      width: min(380px, calc(100vw - 44px));
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .progress strong {
      display: block;
      margin-bottom: 12px;
      color: rgba(247, 242, 232, 0.88);
      font-size: 14px;
      font-weight: 500;
    }

    .bar {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .bar span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--gold), var(--amber));
      transition: width 420ms ease;
    }

    .hint {
      margin: 12px 0 0;
      color: rgba(247, 242, 232, 0.42);
      font-size: 12px;
      line-height: 1.7;
    }

    .magic {
      position: fixed;
      z-index: 2;
      width: 118px;
      height: 118px;
      margin: -59px 0 0 -59px;
      border: 1px solid rgba(136, 244, 255, 0.36);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(136, 244, 255, 0.16), transparent 62%);
      box-shadow: 0 0 44px rgba(136, 244, 255, 0.18);
      transition: opacity 180ms ease;
    }

    .magic.on {
      opacity: 1;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.68);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid rgba(246, 201, 111, 0.28);
      border-radius: 8px;
      padding: clamp(24px, 4vw, 42px);
      background:
        radial-gradient(circle at 86% 12%, rgba(246, 201, 111, 0.14), transparent 28%),
        radial-gradient(circle at 8% 88%, rgba(136, 244, 255, 0.08), transparent 26%),
        rgba(4, 4, 4, 0.94);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.74);
      transform: translateY(16px) scale(0.98);
      transition: transform 220ms ease;
    }

    .modal.open .card {
      transform: translateY(0) scale(1);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .keyword {
      margin: 0;
      color: var(--gold);
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1;
      font-weight: 300;
      letter-spacing: 0.12em;
    }

    .date {
      margin-top: 12px;
      color: rgba(247, 242, 232, 0.48);
      font-size: 13px;
    }

    .close {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      font-size: 26px;
      line-height: 1;
    }

    .section {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section h2 {
      margin: 0 0 10px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
    }

    .section p {
      margin: 0;
      color: rgba(247, 242, 232, 0.86);
      font-size: 16px;
      line-height: 1.9;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .steps li {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(247, 242, 232, 0.86);
    }

    .final {
      position: fixed;
      left: clamp(22px, 6vw, 88px);
      bottom: clamp(24px, 8vh, 74px);
      z-index: 4;
      width: min(560px, calc(100vw - 44px));
      padding: 20px 22px;
      border: 1px solid rgba(246, 201, 111, 0.34);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.82);
      color: rgba(247, 242, 232, 0.92);
      line-height: 1.9;
      transform: translateY(22px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 360ms ease, transform 360ms ease;
      backdrop-filter: blur(18px);
    }

    .final.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 820px) {
      html,
      body {
        overflow: auto;
      }

      body::before {
        background:
          radial-gradient(circle at 70% 48%, rgba(255, 139, 59, 0.12), transparent 42%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.26) 52%, rgba(0, 0, 0, 0.86) 100%);
      }

      .hero {
        top: 24px;
      }

      .progress {
        bottom: 18px;
      }

      .intro {
        max-width: 310px;
      }
    }
  </style>
</head>
<body>
  <canvas id="tree" aria-hidden="true"></canvas>
  <div id="magic" class="magic"></div>

  <main class="hero">
    <p class="eyebrow">MENTOR KEYWORD TREE</p>
    <h1>思维之树<span>摘下那些被点亮的瞬间</span></h1>
    <p class="intro">每一颗果实，都是一次交流之后留下的关键词。摘下它，就能看到那个场景、那条判断路径，以及我真正学到的东西。</p>
    <div class="toolbar">
      <button id="pickRandom">随机摘一颗</button>
      <button id="toggleMagic">开启魔法模式</button>
    </div>
  </main>

  <aside class="progress">
    <strong id="counter">已摘下 0 / 8 颗果实</strong>
    <div class="bar"><span id="bar"></span></div>
    <p class="hint">树会从下往上生长。点击右侧树冠上的发光果实，或开启魔法模式后用光圈靠近果实。</p>
  </aside>

  <section id="modal" class="modal" aria-modal="true" role="dialog">
    <article class="card">
      <div class="card-top">
        <div>
          <p id="keyword" class="keyword"></p>
          <div id="date" class="date"></div>
        </div>
        <button id="close" class="close" aria-label="关闭">×</button>
      </div>

      <div class="section">
        <h2>生长时刻</h2>
        <p id="scene"></p>
      </div>

      <div class="section">
        <h2>我看到的你</h2>
        <p id="observation"></p>
      </div>

      <div class="section">
        <h2>思考路径</h2>
        <ul id="thinking" class="steps"></ul>
      </div>

      <div class="section">
        <h2>我摘到的东西</h2>
        <p id="lesson"></p>
      </div>

      <div class="section">
        <h2>留在我身上的一句话</h2>
        <p id="quote"></p>
      </div>
    </article>
  </section>

  <div id="final" class="final">
    这些果实不是我对你的简单总结，而是你在我身上留下的思考方式。谢谢你把很多答案，变成了我以后也能继续生长的判断力。
  </div>

  <script>
    const records = [
      {
        keyword: "清醒",
        short: "清",
        date: "第 1 颗果实",
        scene: "那天我急着问方案怎么推进，你先让我回到目标本身：这个问题到底要解决什么。",
        observation: "你不会被表层动作带着走，而是先把问题放回正确的位置。",
        thinking: ["先确认目标是否清楚", "再判断约束和代价", "最后选择值得投入的动作"],
        lesson: "有效行动不是更快开始，而是先确认自己没有跑偏。",
        quote: "方向感比执行力更早决定结果。"
      },
      {
        keyword: "精准",
        short: "准",
        date: "第 2 颗果实",
        scene: "我给出一堆信息时，你没有全部展开，而是抓住最关键的那个变量继续追问。",
        observation: "你能在杂乱信息里迅速识别真正影响判断的点。",
        thinking: ["剥离噪音", "找到决定性变量", "围绕变量验证结论"],
        lesson: "复杂问题不一定要复杂处理，先找到杠杆点。",
        quote: "把力气用在真正改变结果的地方。"
      },
      {
        keyword: "耐心",
        short: "耐",
        date: "第 3 颗果实",
        scene: "我一开始没理解你的意思，你没有直接否定，而是换了一个例子重新讲。",
        observation: "你的耐心不是放慢节奏，而是愿意为理解搭桥。",
        thinking: ["确认对方卡在哪里", "换一种表达方式", "让对方自己接上逻辑"],
        lesson: "好的带教不是灌输答案，而是帮助别人完成理解。",
        quote: "真正的沟通，是让对方也能走完那条路。"
      },
      {
        keyword: "边界",
        short: "界",
        date: "第 4 颗果实",
        scene: "讨论任务范围时，你提醒我要分清什么是必须完成，什么只是锦上添花。",
        observation: "你会保护目标，也会保护投入，不让事情无限膨胀。",
        thinking: ["定义必须交付的结果", "识别额外动作的收益", "控制范围和节奏"],
        lesson: "边界感不是保守，而是让重要的事情真的落地。",
        quote: "先把该完成的完成，再谈更漂亮。"
      },
      {
        keyword: "长远",
        short: "远",
        date: "第 5 颗果实",
        scene: "我只看到眼前任务，你提醒我这个动作会不会形成以后可复用的方法。",
        observation: "你习惯把一次具体工作，放进更长的成长路径里看。",
        thinking: ["判断眼前收益", "提炼可复用方法", "沉淀到下一次也能使用"],
        lesson: "成长不是完成很多事，而是每次完成后都留下能力。",
        quote: "一次任务结束后，方法应该继续留下来。"
      },
      {
        keyword: "坦诚",
        short: "诚",
        date: "第 6 颗果实",
        scene: "你指出我方案里的问题时很直接，但也明确说明为什么这会影响结果。",
        observation: "你的坦诚不是情绪化评价，而是把问题摊开，让人能改。",
        thinking: ["指出具体问题", "说明影响后果", "给出可调整方向"],
        lesson: "真正有帮助的反馈，应该让人知道下一步怎么变好。",
        quote: "直接不是锋利，直接是负责。"
      },
      {
        keyword: "结构",
        short: "构",
        date: "第 7 颗果实",
        scene: "你让我把想法从一段话拆成背景、问题、判断、行动四层。",
        observation: "你总能把混乱表达整理成可讨论、可推进的结构。",
        thinking: ["先放背景", "再定义问题", "接着给判断", "最后落到行动"],
        lesson: "结构不是形式感，而是让别人更快进入同一个问题。",
        quote: "表达清楚，本身就是推进。"
      },
      {
        keyword: "笃定",
        short: "定",
        date: "第 8 颗果实",
        scene: "当方向已经判断清楚时，你没有反复摇摆，而是推动我把事情做下去。",
        observation: "你的笃定来自前面充分的判断，而不是盲目的自信。",
        thinking: ["把前提想清楚", "接受不确定性", "在可承受范围内推进"],
        lesson: "不是等完全确定才行动，而是知道为什么值得行动。",
        quote: "想清楚之后，就给行动一点信任。"
      }
    ];

    const canvas = document.getElementById("tree");
    const ctx = canvas.getContext("2d");
    const modal = document.getElementById("modal");
    const magic = document.getElementById("magic");
    const final = document.getElementById("final");
    const counter = document.getElementById("counter");
    const bar = document.getElementById("bar");
    const fruitState = records.map(() => false);
    const pointer = { x: -999, y: -999 };
    let particles = [];
    let fruits = [];
    let stars = [];
    let magicMode = false;
    let pixelRatio = 1;
    let startTime = performance.now();

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * pixelRatio);
      canvas.height = Math.floor(innerHeight * pixelRatio);
      canvas.style.width = innerWidth + "px";
      canvas.style.height = innerHeight + "px";
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      buildScene();
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function addParticle(x, y, thickness, kind) {
      const birth = 1 - y / innerHeight;
      particles.push({
        x,
        y,
        baseX: x,
        baseY: y,
        r: rand(0.45, 1.7) * Math.max(0.72, thickness / 5),
        a: rand(0.28, 0.92),
        birth: Math.max(0, Math.min(1, birth + rand(-0.05, 0.08))),
        drift: rand(0, Math.PI * 2),
        kind
      });
    }

    function pointOnBranch(x, y, angle, length, ratio) {
      const curve = Math.sin(ratio * Math.PI) * length * 0.08;
      return {
        x: x + Math.cos(angle) * length * ratio + Math.cos(angle - Math.PI / 2) * curve,
        y: y + Math.sin(angle) * length * ratio
      };
    }

    function branch(x, y, angle, length, depth, thickness) {
      if (depth <= 0 || length < 18) return;
      const steps = Math.max(14, Math.floor(length / 6));
      let endX = x;
      let endY = y;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const curve = Math.sin(t * Math.PI) * length * 0.08;
        const nx = x + Math.cos(angle) * length * t + Math.cos(angle - Math.PI / 2) * curve;
        const ny = y + Math.sin(angle) * length * t;
        const dots = Math.max(2, Math.round(thickness * 1.7));
        for (let d = 0; d < dots; d++) {
          addParticle(nx + rand(-thickness, thickness), ny + rand(-thickness, thickness), thickness, depth > 4 ? "trunk" : "branch");
        }
        endX = nx;
        endY = ny;
      }

      const next = length * rand(0.58, 0.72);
      const spread = rand(0.33, 0.54);
      if (depth > 5) {
        const leftPoint = pointOnBranch(x, y, angle, length, 0.45);
        const rightPoint = pointOnBranch(x, y, angle, length, 0.62);
        branch(leftPoint.x, leftPoint.y, angle - spread * 1.18, next * 0.62, depth - 2, thickness * 0.46);
        branch(rightPoint.x, rightPoint.y, angle + spread * 0.95, next * 0.58, depth - 2, thickness * 0.42);
      }
      branch(endX, endY, angle - spread, next, depth - 1, thickness * 0.72);
      branch(endX, endY, angle + spread * rand(0.72, 1.14), next * rand(0.86, 1.08), depth - 1, thickness * 0.68);
      if (depth > 4) {
        branch(endX, endY, angle + rand(-0.2, 0.2), next * 0.54, depth - 2, thickness * 0.5);
      }
    }

    function buildScene() {
      particles = [];
      stars = [];
      const baseX = innerWidth * (innerWidth < 820 ? 0.66 : 0.76);
      const baseY = innerHeight * 0.96;
      const trunk = Math.min(innerHeight * 0.5, innerWidth * 0.36);
      branch(baseX, baseY, -Math.PI / 2 - 0.08, trunk, 9, Math.max(3.8, innerWidth * 0.006));

      for (let i = 0; i < 140; i++) {
        stars.push({
          x: rand(innerWidth * 0.36, innerWidth),
          y: rand(0, innerHeight),
          r: rand(0.3, 1.1),
          a: rand(0.08, 0.44),
          pulse: rand(0, Math.PI * 2)
        });
      }

      const positions = innerWidth < 820
        ? [[0.60, 0.32], [0.74, 0.23], [0.84, 0.36], [0.66, 0.48], [0.80, 0.52], [0.90, 0.47], [0.55, 0.58], [0.73, 0.66]]
        : [[0.64, 0.35], [0.76, 0.21], [0.86, 0.34], [0.69, 0.48], [0.82, 0.50], [0.91, 0.44], [0.59, 0.57], [0.76, 0.65]];

      fruits = records.map((record, index) => {
        const [fx, fy] = positions[index];
        return {
          x: innerWidth * fx,
          y: innerHeight * fy,
          baseX: innerWidth * fx,
          baseY: innerHeight * fy,
          radius: Math.max(17, Math.min(innerWidth, innerHeight) * 0.025),
          birth: Math.max(0.2, 1 - fy + 0.08),
          record,
          index,
          pulse: rand(0, Math.PI * 2)
        };
      });
    }

    function draw(time) {
      const elapsed = (time - startTime) / 1000;
      const grow = Math.min(1, elapsed / 3.8);
      const t = time * 0.001;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (const star of stars) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${star.a + Math.sin(t * 1.2 + star.pulse) * 0.06})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const p of particles) {
        if (p.birth > grow) continue;
        const appear = Math.min(1, (grow - p.birth) / 0.1);
        const dx = pointer.x - p.baseX;
        const dy = pointer.y - p.baseY;
        const dist = Math.hypot(dx, dy);
        const field = magicMode && dist < 150 ? (1 - dist / 150) * 22 : 0;
        const wave = Math.sin(t * 1.4 + p.drift + p.baseY * 0.013) * (p.kind === "trunk" ? 0.8 : 1.8);
        const x = p.baseX + wave - dx * field * 0.01;
        const y = p.baseY + Math.cos(t + p.drift) * 0.8 - dy * field * 0.01;
        const warm = p.kind === "trunk";
        ctx.beginPath();
        ctx.fillStyle = warm
          ? `rgba(255, 179, 74, ${p.a * appear})`
          : `rgba(128, 235, 255, ${p.a * 0.62 * appear})`;
        ctx.arc(x, y, p.r * appear, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const fruit of fruits) {
        if (fruitState[fruit.index] || fruit.birth > grow + 0.08) continue;
        const appear = Math.min(1, (grow + 0.08 - fruit.birth) / 0.18);
        const hover = Math.hypot(pointer.x - fruit.x, pointer.y - fruit.y) < fruit.radius + 34;
        fruit.x = fruit.baseX + Math.cos(t * 1.1 + fruit.pulse) * 3;
        fruit.y = fruit.baseY + Math.sin(t * 1.5 + fruit.pulse) * 5;
        const glow = (hover ? 1.25 : 0.78 + Math.sin(t * 2 + fruit.pulse) * 0.18) * appear;

        const halo = ctx.createRadialGradient(fruit.x, fruit.y, 2, fruit.x, fruit.y, fruit.radius * 3.6);
        halo.addColorStop(0, `rgba(255, 234, 168, ${0.92 * glow})`);
        halo.addColorStop(0.28, `rgba(255, 141, 59, ${0.46 * glow})`);
        halo.addColorStop(1, "rgba(255, 141, 59, 0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(fruit.x, fruit.y, fruit.radius * 3.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 202, 111, ${0.92 * appear})`;
        ctx.beginPath();
        ctx.arc(fruit.x, fruit.y, fruit.radius * appear, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(0, 0, 0, ${0.76 * appear})`;
        ctx.font = `500 ${Math.max(13, fruit.radius * 0.78)}px "Microsoft YaHei", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(fruit.record.short, fruit.x, fruit.y + 1);
      }
      ctx.restore();

      requestAnimationFrame(draw);
    }

    function openFruit(index) {
      if (index < 0 || fruitState[index]) return;
      fruitState[index] = true;
      const record = records[index];
      document.getElementById("keyword").textContent = record.keyword;
      document.getElementById("date").textContent = record.date;
      document.getElementById("scene").textContent = record.scene;
      document.getElementById("observation").textContent = record.observation;
      document.getElementById("lesson").textContent = record.lesson;
      document.getElementById("quote").textContent = record.quote;
      const thinking = document.getElementById("thinking");
      thinking.innerHTML = "";
      record.thinking.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        thinking.appendChild(li);
      });
      modal.classList.add("open");
      updateProgress();
    }

    function updateProgress() {
      const count = fruitState.filter(Boolean).length;
      counter.textContent = `已摘下 ${count} / ${records.length} 颗果实`;
      bar.style.width = `${Math.round(count / records.length * 100)}%`;
      final.classList.toggle("show", count === records.length);
      document.querySelector(".progress").style.opacity = count === records.length ? "0" : "1";
    }

    function fruitAt(x, y, extra = 0) {
      return fruits.find((fruit) => !fruitState[fruit.index] && Math.hypot(x - fruit.x, y - fruit.y) < fruit.radius + extra);
    }

    canvas.addEventListener("click", (event) => {
      const fruit = fruitAt(event.clientX, event.clientY, 28);
      if (fruit) openFruit(fruit.index);
    });

    window.addEventListener("pointermove", (event) => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      magic.style.left = pointer.x + "px";
      magic.style.top = pointer.y + "px";
      if (magicMode) {
        const fruit = fruitAt(pointer.x, pointer.y, 44);
        if (fruit) openFruit(fruit.index);
      }
    });

    document.getElementById("pickRandom").addEventListener("click", () => {
      const remaining = fruitState.map((picked, index) => picked ? -1 : index).filter((index) => index >= 0);
      if (remaining.length) openFruit(remaining[Math.floor(Math.random() * remaining.length)]);
    });

    document.getElementById("toggleMagic").addEventListener("click", (event) => {
      magicMode = !magicMode;
      magic.classList.toggle("on", magicMode);
      event.currentTarget.textContent = magicMode ? "关闭魔法模式" : "开启魔法模式";
    });

    document.getElementById("close").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("open");
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.classList.remove("open");
    });
    window.addEventListener("resize", resize);

    resize();
    updateProgress();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
